name: Build Docu2TeX Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        id: project
        shell: pwsh
        run: |
          if (Test-Path 'Docu2TeX/pytest.ini') {
            "dir=Docu2TeX" >> $env:GITHUB_OUTPUT
          } else {
            "dir=." >> $env:GITHUB_OUTPUT
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            ${{ steps.project.outputs.dir }}/requirements.txt
            ${{ steps.project.outputs.dir }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest

      - name: Run tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: python -m pytest -q

  build-windows:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        id: project
        shell: pwsh
        run: |
          if (Test-Path 'Docu2TeX/build_windows.spec') {
            "dir=Docu2TeX" >> $env:GITHUB_OUTPUT
          } else {
            "dir=." >> $env:GITHUB_OUTPUT
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            ${{ steps.project.outputs.dir }}/requirements.txt
            ${{ steps.project.outputs.dir }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install pyinstaller

      - name: Build EXE
        working-directory: ${{ steps.project.outputs.dir }}
        run: python -m PyInstaller --noconfirm --clean build_windows.spec

      - name: Verify EXE exists
        working-directory: ${{ steps.project.outputs.dir }}
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Docu2TeX.exe')) {
            throw 'Docu2TeX.exe was not produced.'
          }
          Get-Item 'dist/Docu2TeX.exe'

      - name: Archive
        working-directory: ${{ steps.project.outputs.dir }}
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Docu2TeX.exe' -DestinationPath 'Docu2TeX-Windows.zip' -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docu2TeX-Windows
          path: ${{ steps.project.outputs.dir }}/Docu2TeX-Windows.zip
          if-no-files-found: error

      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.project.outputs.dir }}/Docu2TeX-Windows.zip
