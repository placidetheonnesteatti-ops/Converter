name: Build Docu2TeX Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

    tags:
      - "v*"

permissions:
  contents: write


env:
  PYTHON_VERSION: "3.11"


jobs:

  # ============================================================
  # TESTS
  # ============================================================

  test:

    name: Run tests

    runs-on: windows-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip


      # ----------------------------------------------------------
      # Vérification de la structure
      # ----------------------------------------------------------

      - name: Verify project files
        shell: pwsh

        run: |

          Write-Host "======================================"
          Write-Host "DOCU2TEX - VERIFICATION DU PROJET"
          Write-Host "======================================"

          $requiredFiles = @(
            "main.py",
            "compiler.py",
            "docx_converter.py",
            "pdf_converter.py",
            "latex_utils.py",
            "models.py",
            "service.py",
            "tex_writer.py",
            "ui.py",
            "build_windows.spec",
            "requirements.txt"
          )

          $missing = @()

          foreach ($file in $requiredFiles) {

            if (Test-Path $file) {

              Write-Host "[OK] $file"

            }
            else {

              Write-Host "[MISSING] $file"

              $missing += $file
            }
          }

          Write-Host ""

          if ($missing.Count -gt 0) {

            Write-Error "Des fichiers nécessaires sont absents."

            exit 1
          }

          Write-Host "Tous les fichiers principaux sont présents."


      # ----------------------------------------------------------
      # Installation des dépendances
      # ----------------------------------------------------------

      - name: Install dependencies
        shell: pwsh

        run: |

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {

            python -m pip install -r requirements.txt

          }

          if (Test-Path "requirements-dev.txt") {

            python -m pip install -r requirements-dev.txt

          }

          python -m pip install pytest


      # ----------------------------------------------------------
      # Vérification Python
      # ----------------------------------------------------------

      - name: Verify Python
        shell: pwsh

        run: |

          Write-Host "Python :"

          python --version

          Write-Host ""

          Write-Host "Pytest :"

          python -m pytest --version


      # ----------------------------------------------------------
      # Vérifier les fichiers de tests
      # ----------------------------------------------------------

      - name: Verify test files
        shell: pwsh

        run: |

          Write-Host "======================================"
          Write-Host "TESTS TROUVES"
          Write-Host "======================================"

          $testFiles = @(
            Get-ChildItem -Path . -Filter "test_*.py" -File
          )

          if ($testFiles.Count -eq 0) {

            Write-Error "Aucun fichier test_*.py trouvé."

            exit 1
          }

          foreach ($file in $testFiles) {

            Write-Host "[OK] $($file.Name)"

          }

          Write-Host ""

          Write-Host "Nombre de fichiers de tests : $($testFiles.Count)"


      # ----------------------------------------------------------
      # Exécution des tests
      # ----------------------------------------------------------

      - name: Run pytest
        shell: pwsh

        run: |

          Write-Host "======================================"
          Write-Host "EXECUTION DE PYTEST"
          Write-Host "======================================"

          python -m pytest -q


      # ----------------------------------------------------------
      # Vérification syntaxique
      # ----------------------------------------------------------

      - name: Verify Python syntax
        shell: pwsh

        run: |

          Write-Host "======================================"
          Write-Host "VERIFICATION SYNTAXIQUE"
          Write-Host "======================================"

          python -m compileall -q .

          if ($LASTEXITCODE -ne 0) {

            Write-Error "Erreur de syntaxe Python."

            exit 1
          }

          Write-Host "Syntaxe Python correcte."


  # ============================================================
  # BUILD WINDOWS
  # ============================================================

  build-windows:

    name: Build Windows executable

    needs: test

    runs-on: windows-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip


      # ----------------------------------------------------------
      # Installation
      # ----------------------------------------------------------

      - name: Install dependencies
        shell: pwsh

        run: |

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {

            python -m pip install -r requirements.txt

          }

          if (Test-Path "requirements-dev.txt") {

            python -m pip install -r requirements-dev.txt

          }

          python -m pip install pyinstaller


      # ----------------------------------------------------------
      # Vérification PyInstaller
      # ----------------------------------------------------------

      - name: Verify PyInstaller
        shell: pwsh

        run: |

          python --version

          python -m PyInstaller --version


      # ----------------------------------------------------------
      # Vérification du fichier SPEC
      # ----------------------------------------------------------

      - name: Verify build specification
        shell: pwsh

        run: |

          if (!(Test-Path "build_windows.spec")) {

            Write-Error "build_windows.spec est introuvable."

            exit 1
          }

          Write-Host "[OK] build_windows.spec"


      # ----------------------------------------------------------
      # Construction
      # ----------------------------------------------------------

      - name: Build EXE
        shell: pwsh

        run: |

          Write-Host "======================================"
          Write-Host "CONSTRUCTION DE DOCU2TEX"
          Write-Host "======================================"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            build_windows.spec

          if ($LASTEXITCODE -ne 0) {

            Write-Error "PyInstaller a échoué."

            exit 1
          }


      # ----------------------------------------------------------
      # Vérification de l'EXE
      # ----------------------------------------------------------

      - name: Verify EXE
        shell: pwsh

        run: |

          Write-Host "======================================"
          Write-Host "VERIFICATION DE L'EXECUTABLE"
          Write-Host "======================================"

          $exe = "dist\Docu2TeX.exe"

          if (!(Test-Path $exe)) {

            Write-Error "Docu2TeX.exe n'a pas été créé."

            Write-Host ""
            Write-Host "Contenu du dossier dist :"

            if (Test-Path "dist") {

              Get-ChildItem "dist" -Recurse -Force

            }

            exit 1
          }

          Write-Host ""
          Write-Host "[OK] Docu2TeX.exe"

          Get-Item $exe


      # ----------------------------------------------------------
      # Création du ZIP
      # ----------------------------------------------------------

      - name: Create Windows ZIP
        shell: pwsh

        run: |

          Write-Host "======================================"
          Write-Host "CREATION DE L'ARCHIVE WINDOWS"
          Write-Host "======================================"

          $exe = "dist\Docu2TeX.exe"

          $zip = "Docu2TeX-Windows.zip"

          if (Test-Path $zip) {

            Remove-Item $zip -Force

          }

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {

            Write-Error "Impossible de créer l'archive."

            exit 1
          }

          Write-Host "[OK] $zip"

          Get-Item $zip


      # ----------------------------------------------------------
      # Upload Artifact
      # ----------------------------------------------------------

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4

        with:
          name: Docu2TeX-Windows
          path: Docu2TeX-Windows.zip
          if-no-files-found: error


      # ----------------------------------------------------------
      # GitHub Release pour les tags
      # ----------------------------------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')

        uses: softprops/action-gh-release@v2

        with:
          files: Docu2TeX-Windows.zip
          generate_release_notes: true
