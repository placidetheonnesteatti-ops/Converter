name: Build Docu2TeX Windows

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # 1. Récupérer le projet
      # --------------------------------------------------
      - name: Checkout du projet
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Installer Python
      # --------------------------------------------------
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Déterminer le dossier du projet
      # --------------------------------------------------
      - name: Détecter la structure du projet
        shell: pwsh
        run: |
          if (Test-Path "Docu2TeX") {
              Write-Host "Projet détecté dans le dossier Docu2TeX"
              "PROJECT_DIR=Docu2TeX" >> $env:GITHUB_ENV
          }
          else {
              Write-Host "Projet détecté à la racine"
              "PROJECT_DIR=." >> $env:GITHUB_ENV
          }

      # --------------------------------------------------
      # 4. Mettre pip à jour
      # --------------------------------------------------
      - name: Mettre pip à jour
        run: |
          python -m pip install --upgrade pip

      # --------------------------------------------------
      # 5. Installer les dépendances
      # --------------------------------------------------
      - name: Installer les dépendances
        shell: pwsh
        run: |
          python -m pip install -r "$env:PROJECT_DIR/requirements.txt"
          python -m pip install pytest
          python -m pip install pyinstaller

      # --------------------------------------------------
      # 6. Vérifier l'environnement
      # --------------------------------------------------
      - name: Vérifier Python et les outils
        run: |
          python --version
          python -m pip --version
          python -m pytest --version
          python -m PyInstaller --version

      # --------------------------------------------------
      # 7. Exécuter les tests
      # --------------------------------------------------
      - name: Exécuter les tests
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          python -m pytest -q

      # --------------------------------------------------
      # 8. Vérifier la syntaxe Python
      # --------------------------------------------------
      - name: Vérifier la syntaxe Python
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          python -m compileall -q .

      # --------------------------------------------------
      # 9. Construire l'application Windows
      # --------------------------------------------------
      - name: Construire Docu2TeX
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          python -m PyInstaller Docu2TeX.spec --clean --noconfirm

      # --------------------------------------------------
      # 10. Vérifier l'EXE
      # --------------------------------------------------
      - name: Vérifier Docu2TeX.exe
        shell: pwsh
        run: |
          $exe = Join-Path $env:PROJECT_DIR "dist/Docu2TeX.exe"

          if (!(Test-Path $exe)) {
              Write-Error "Docu2TeX.exe n'a pas été généré."
              exit 1
          }

          Write-Host "EXE trouvé : $exe"
          Get-Item $exe

      # --------------------------------------------------
      # 11. Créer l'archive Windows
      # --------------------------------------------------
      - name: Créer l'archive Windows
        shell: pwsh
        run: |
          $exe = Join-Path $env:PROJECT_DIR "dist/Docu2TeX.exe"
          $zip = "Docu2TeX-Windows.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host "Archive créée : $zip"

      # --------------------------------------------------
      # 12. Publier l'archive comme artefact
      # --------------------------------------------------
      - name: Publier Docu2TeX Windows
        uses: actions/upload-artifact@v4
        with:
          name: Docu2TeX-Windows
          path: Docu2TeX-Windows.zip
          if-no-files-found: error
